[package]
name = "mpc-signer-sim"
description = "Simulator of the Chain Signatures signer contract (v1.signer): same sign/derive interface, one off-chain responder."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
k256.workspace = true
sha3.workspace = true
hex.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
