[package]
name = "integration-tests"
description = "near-workspaces sandbox tests for the Glidepath contracts. Run build.sh first: the tests deploy res/*.wasm."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "std"] }
ed25519-dalek = "2"
sha2 = "0.10"
sha3 = "0.10"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
